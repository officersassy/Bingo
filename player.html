<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bingo Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="player-container">

        <h1>🎱 BINGO PLAYER</h1>

        <h2 id="welcomePlayer">
            Loading your card...
        </h2>

        <div id="playerStatus" class="status-pill">
            Connecting to the game...
        </div>

        <section class="player-call">

            <h3>Current Number</h3>

            <div id="playerCurrent">
                --
            </div>

        </section>

        <section class="bingo">

            <div class="bingo-headers">

                <div class="header">B</div>
                <div class="header">I</div>
                <div class="header">N</div>
                <div class="header">G</div>
                <div class="header">O</div>

            </div>

            <div id="card" class="card"></div>

        </section>

        <div class="action-buttons">

            <button
                id="bingoButton"
                type="button"
                onclick="claimBingo()"
            >
                🎉 BINGO!
            </button>

            <a href="index.html">
                <button type="button">
                    ← Home
                </button>
            </a>

        </div>

        <p class="helper-text">
            Gold numbers have been called. Click a called number to dab it blue.
            Your card is locked and will not change when the page refreshes.
        </p>

    </main>

    <div id="winnerPopup" class="winner-popup">

        <div class="winner-box">

            <div class="winner-title">
                🎉 BINGO WINNER 🎉
            </div>

            <div id="winnerName" class="winner-name">
                We have a winner!
            </div>

            <button
                id="closeWinnerButton"
                type="button"
                onclick="closeWinnerPopup()"
            >
                Close
            </button>

        </div>

    </div>

    <script type="module" src="./player.js"></script>

</body>

</html>
