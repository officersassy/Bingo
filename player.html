<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo Player</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="background"></div>


<div class="player-container">


<h1>🎱 BINGO PLAYER</h1>


<div id="winnerPopup" class="winner-popup"></div>




<div class="player-name-box">

<input 
id="playerName"
placeholder="Enter your name"
>


<button onclick="saveName()">
Join Game
</button>


</div>





<div class="player-call">

<h3>Current Number</h3>

<div id="playerCurrent">
--
</div>

</div>







<div class="bingo">



<div class="header">B</div>
<div class="header">I</div>
<div class="header">N</div>
<div class="header">G</div>
<div class="header">O</div>



<div id="card" class="card"></div>



</div>






<button onclick="createCard()">

🎲 New Card

</button>



<button onclick="claimBingo()">

🎉 BINGO!

</button>





</div>



<script type="module" src="script.js"></script>


</body>

</html>
