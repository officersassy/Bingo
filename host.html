<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bingo Host Control</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="host-container">

    <h1>🎱 BINGO HOST CONTROL</h1>

    <div class="current-card">

        <p>Current Call</p>

        <div id="currentNumber">--</div>

    </div>

    <div class="stats">

        <div class="stat">

            <h3>Called</h3>

            <span id="calledCount">0</span>

        </div>

        <div class="stat">

            <h3>Remaining</h3>

            <span id="remainingCount">75</span>

        </div>

    </div>

    <div class="buttons">

        <button onclick="callNumber()">
            🎲 Call Next Number
        </button>

        <button onclick="resetGame()">
            🔄 Reset Game
        </button>

    </div>

    <h2>Numbers Called</h2>

    <div id="calledNumbers"></div>

</div>

<script src="script.js"></script>

</body>

</html>
