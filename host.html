<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo Host</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="background"></div>



<div class="host-container">



<h1>🎤 BINGO HOST CONTROL</h1>





<!-- WINNER POPUP -->

<div id="winnerPopup" class="winner-popup">


    <div class="winner-box">


        <div id="winnerText">

        </div>


        <button onclick="closeWinner()">

            ❌ CLOSE

        </button>


    </div>


</div>







<div class="current-card">


<h3>CURRENT CALL</h3>


<div id="currentNumber">

--

</div>


</div>







<div class="stats">


<div class="stat">

<h3>Called</h3>

<span id="calledCount">

0

</span>

</div>




<div class="stat">

<h3>Remaining</h3>

<span id="remainingCount">

75

</span>

</div>


</div>







<div class="controls">


<button onclick="callNumber()">

🎱 CALL NEXT NUMBER

</button>



<button onclick="resetGame()">

🔄 RESET GAME

</button>


</div>








<div class="game-status">


<h2>Status</h2>


<div id="gameStatus">

Waiting...

</div>


</div>







<div class="last-call">


<h2>Last 5 Calls</h2>


<div id="lastCalls">

</div>


</div>







<div class="all-called">


<h2>All Called Numbers</h2>


<div id="calledNumbers">

</div>


</div>






</div>





<script type="module" src="script.js"></script>


</body>


</html>
