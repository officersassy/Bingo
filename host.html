<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo Host</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="background"></div>



<div class="host-container">



<h1>🎤 BINGO HOST 🎱</h1>





<div class="host-box">


<h2>Status</h2>

<div id="gameStatus">

Waiting

</div>


</div>






<div class="host-box">


<h2>Players Joined</h2>


<h1 id="playerCount">

0

</h1>



<div id="playerList">

No players yet

</div>


</div>








<div class="host-box">


<h2>Current Number</h2>


<div id="currentNumber">

--

</div>


</div>









<div class="host-buttons">


<button onclick="openJoining()">

🟢 Open Joining

</button>




<button onclick="startGame()">

🔴 Start Game

</button>





<button onclick="callNumber()">

🎱 Call Number

</button>





<button onclick="resetGame()">

♻ Reset Game

</button>



</div>









<div class="host-box">


<h2>Called Numbers</h2>


<div id="calledNumbers">

</div>


</div>





</div>







<script type="module" src="host.js"></script>


</body>

</html>
