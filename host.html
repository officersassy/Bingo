<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo Host</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="background"></div>


<div class="host-container">


<h1>🎤 BINGO HOST CONTROL</h1>


<div id="winnerPopup" class="winner-popup"></div>



<div class="current-card">

<h3>CURRENT CALL</h3>

<div id="currentNumber">
--
</div>

</div>




<div class="stats">


<div class="stat">

<h3>Called</h3>

<span id="calledCount">
0
</span>

</div>



<div class="stat">

<h3>Remaining</h3>

<span id="remainingCount">
75
</span>

</div>


</div>




<button onclick="callNumber()">

🎱 CALL NEXT NUMBER

</button>



<button onclick="resetGame()">

🔄 RESET GAME

</button>




<div class="game-status">

<h2>Status</h2>

<div id="gameStatus">
Waiting...
</div>

</div>



<div id="lastCalls"></div>


<div id="calledNumbers"></div>



</div>




<script type="module" src="script.js"></script>


</body>

</html>
