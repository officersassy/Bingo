<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo Host Control</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<div class="host-panel">

<h1>🎱 BINGO CONTROL</h1>

<div class="current-panel">

<h3>CURRENT CALL</h3>

<div id="currentNumber">--</div>

</div>

<div class="stats">

<div class="stat-box">

<h4>Called</h4>

<span id="calledCount">0</span>

</div>

<div class="stat-box">

<h4>Remaining</h4>

<span id="remainingCount">75</span>

</div>

</div>

<div class="controls">

<button onclick="callNumber()">
🎲 CALL NEXT NUMBER
</button>

<button onclick="resetGame()">
🔄 RESET GAME
</button>

</div>

<h2>Called Numbers</h2>

<div id="calledNumbers"></div>

</div>

<script src="script.js"></script>

</body>
</html>
